[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcwl-tg-manager"
version = "0.1.0"
description = "Telegram bot for managing a Minecraft server whitelist"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["aiogram>=3.31,<4"]

[project.scripts]
mcwl-tg-manager = "mcwl_tg_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
